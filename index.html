<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyper Useless Coin — $HUC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0b1716;
    --bg-panel:#0f201f;
    --gold:#c9a24b;
    --gold-bright:#e9cd88;
    --teal-line: rgba(120,180,170,0.18);
    --text-hi:#efe9da;
    --text-lo:#9fb3ae;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, #163331 0%, var(--bg-deep) 55%) fixed;
    color:var(--text-hi);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  header{
    width:100%;
    max-width:1040px;
    padding:2.2rem 1.5rem 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.85rem;
    letter-spacing:0.02em;
    color:var(--text-lo);
  }
  header .mark{ color:var(--gold-bright); font-weight:600; }

  main{
    width:100%;
    max-width:720px;
    padding:3.5rem 1.5rem 2rem;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .coin-wrap{
    position:relative;
    width:min(60vw, 320px);
    aspect-ratio:1;
    margin-bottom:2.4rem;
    filter: drop-shadow(0 30px 60px rgba(0,0,0,0.55));
  }
  .coin-wrap img,
  .coin-wrap video{
    width:100%;
    height:100%;
    border-radius:50%;
  }
  .coin-wrap img{ object-fit:contain; }
  .coin-wrap video{ object-fit:cover; }
  .coin-wrap img{
    animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1) rotate(0deg); }
    50%{ transform: scale(1.015) rotate(0.6deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .coin-wrap img{ animation:none; }
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(2.4rem, 6vw, 3.6rem);
    line-height:1.05;
    margin:0 0 0.9rem;
    letter-spacing:-0.01em;
  }
  h1 em{
    font-style:italic;
    font-weight:300;
    color:var(--gold-bright);
  }

  p.lede{
    font-size:1.05rem;
    line-height:1.6;
    color:var(--text-lo);
    max-width:34ch;
    margin:0 0 2.4rem;
  }

  .stat-row{
    display:flex;
    gap:0;
    width:100%;
    max-width:480px;
    border-top:1px solid var(--teal-line);
    border-bottom:1px solid var(--teal-line);
    margin-bottom:2.6rem;
  }
  .stat{
    flex:1;
    padding:1.1rem 0.5rem;
    text-align:center;
  }
  .stat + .stat{ border-left:1px solid var(--teal-line); }
  .stat .n{
    display:block;
    font-family:'Fraunces', serif;
    font-size:1.5rem;
    color:var(--gold-bright);
  }
  .stat .l{
    display:block;
    font-size:0.75rem;
    color:var(--text-lo);
    margin-top:0.25rem;
  }

  a.cta{
    display:inline-block;
    padding:0.9rem 2.1rem;
    background:var(--gold);
    color:#14201c;
    font-weight:600;
    text-decoration:none;
    border-radius:999px;
    font-size:0.95rem;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  a.cta:hover{ background:var(--gold-bright); transform: translateY(-1px); }

  footer{
    margin-top:auto;
    padding:2.5rem 1.5rem;
    font-size:0.8rem;
    color:var(--text-lo);
    opacity:0.7;
  }

  p.ca{
    margin:1.1rem 0 0;
    font-size:0.72rem;
    color:var(--text-lo);
    letter-spacing:0.02em;
    word-break:break-all;
    max-width:38ch;
  }
</style>
</head>
<body>

  <header>
    <span class="mark">HYPERUSELESS</span>
    <span>$HUC</span>
  </header>

  <main>
    <div class="coin-wrap">
      <video src="hero.mp4" poster="poster.jpg" autoplay muted loop playsinline></video>
    </div>

    <h1>Maximum speed.<br><em>Zero utility.</em></h1>
    <p class="lede">
      Built on the fastest execution layer in crypto, engineered to do
      absolutely nothing with it.
    </p>

    <div class="stat-row">
      <div class="stat">
        <span class="n">0.2s</span>
        <span class="l">finality</span>
      </div>
      <div class="stat">
        <span class="n">0</span>
        <span class="l">utility</span>
      </div>
      <div class="stat">
        <span class="n">∞</span>
        <span class="l">conviction</span>
      </div>
    </div>

    <a class="cta" href="https://www.ethics.ltd/token/5Rhic22TdXRUPWsQFNABr5J56LBnfJgfsF9WY1sqpPyg" target="_blank" rel="noopener">View on Ethics.ltd</a>

    <p class="ca">5Rhic22TdXRUPWsQFNABr5J56LBnfJgfsF9WY1sqpPyg</p>
  </main>

  <footer>
    $HUC — no roadmap, no promises, no problem.
  </footer>

</body>
</html>
